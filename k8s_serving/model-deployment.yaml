apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-model-deployment
  namespace: mlops-k8s
  labels:
    app: iris-model
spec:
  replicas: 3
  selector:
    matchLabels:
      app: iris-model
  template:
    metadata:
      labels:
        app: iris-model
    spec:
      containers:
        - name: model-server
          image: python:3.11-slim
          command: ["python", "-m", "http.server", "8000", "--directory", "/tmp"]
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: iris-model-svc
  namespace: mlops-k8s
spec:
  selector:
    app: iris-model
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
